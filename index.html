<!DOCTYPE html>
<!--
  ไฟล์นี้คือ "หน้าบ้าน" สำหรับโฮสต์บน GitHub Pages
  แก้ APPS_SCRIPT_URL ในแท็ก <script> ด้านล่างให้เป็น URL เว็บแอป Apps Script ของคุณ ก่อนใช้งานจริง
-->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root{
      --primary:#2f6f4e;
      --primary-dark:#1c4a32;
      --primary-light:#e6efe8;
      --accent:#c99a3b;
      --bg:#f2f4f0;
      --card:#ffffff;
      --text:#22302a;
      --muted:#6b7b71;
      --danger:#c0453c;
      --radius:16px;
      --shadow:0 2px 12px rgba(28,74,50,.10);
      --shadow-lg:0 12px 40px rgba(20,40,30,.28);
    }
    *{box-sizing:border-box;}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    html,body{margin:0;padding:0;}
    body{
      font-family:'Sarabun',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    button{font-family:inherit;cursor:pointer;}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

    /* ---------- Header ---------- */
    header{
      background:linear-gradient(135deg,var(--primary-dark),var(--primary));
      color:#fff;
      padding:20px 20px 24px;
    }
    header .headerInner{
      max-width:1000px;margin:0 auto;
      display:flex;align-items:center;gap:14px;
    }
    .brandMark{
      width:46px;height:46px;border-radius:12px;
      background:rgba(255,255,255,.16);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
    }
    header h1{
      font-size:19px;margin:0;font-weight:700;line-height:1.3;
    }
    header p{
      margin:2px 0 0;font-size:13px;opacity:.85;font-weight:400;
    }
    #userBadge{
      margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);
      padding:6px 12px;border-radius:999px;white-space:nowrap;
    }

    main{max-width:1000px;margin:24px auto 60px;padding:0 20px;}

    /* ---------- Toolbar ---------- */
    .toolbar{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      display:flex;gap:10px;flex-wrap:wrap;
      margin-bottom:22px;
    }
    .searchBox{
      flex:1;min-width:180px;
      display:flex;align-items:center;gap:8px;
      background:var(--bg);
      border-radius:10px;padding:0 12px;
    }
    .searchBox input{
      border:none;background:transparent;padding:11px 0;
      font-family:inherit;font-size:15px;width:100%;color:var(--text);
    }
    .searchBox input:focus{outline:none;}
    .btn{
      border:none;border-radius:10px;padding:11px 18px;font-size:14px;
      font-weight:600;display:inline-flex;align-items:center;gap:8px;
      transition:transform .12s ease, background .15s ease;
    }
    .btn:active{transform:scale(.97);}
    .btn-primary{background:var(--primary);color:#fff;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-ghost{background:var(--bg);color:var(--text);}
    .btn-ghost:hover{background:#e5e9e3;}
    .btn-danger{background:#fbeceb;color:var(--danger);}
    .btn-danger:hover{background:#f6dad8;}
    .btn-icon{padding:10px;border-radius:10px;}

    /* ---------- Album grid ---------- */
    #albumGrid{
      display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
    }
    .albumCard{
      background:var(--card);border-radius:var(--radius);
      box-shadow:var(--shadow);overflow:hidden;position:relative;
      text-align:left;border:none;padding:0;
      display:flex;flex-direction:column;
    }
    .albumCard .tab{
      height:8px;background:linear-gradient(90deg,var(--accent),var(--primary));
    }
    .albumCard .cover{
      position:relative;aspect-ratio:4/3;
      display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
      gap:2px;background:var(--primary-light);
    }
    .albumCard .cover img{
      width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;
    }
    .albumCard .cover .coverBlank{background:var(--primary-light);}
    .albumCard .cover .coverEmpty{
      grid-column:1/3;grid-row:1/3;
      display:flex;align-items:center;justify-content:center;color:var(--primary);
    }
    .albumCard .cover .coverEmpty svg{width:34px;height:34px;}
    .albumCard .body{padding:12px 14px 14px;}
    .albumCard .name{
      font-weight:600;font-size:14.5px;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;min-height:38px;
    }
    .albumCard .meta{font-size:12px;color:var(--muted);margin-top:6px;}
    .albumCard .cardActions{
      position:absolute;top:10px;right:10px;display:flex;gap:6px;
    }
    .albumCard .iconBtn{
      width:30px;height:30px;border-radius:8px;border:none;
      background:rgba(255,255,255,.92);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 1px 4px rgba(0,0,0,.15);
    }
    .albumCard .iconBtn svg{width:14px;height:14px;}
    .albumCard .iconBtn.edit{color:var(--primary);}
    .albumCard .iconBtn.danger{color:var(--danger);}
    .albumCardBtn{width:100%;text-align:left;cursor:pointer;}

    /* ---------- แถบเปลี่ยนหน้าอัลบั้ม ---------- */
    .pagination{
      display:flex;align-items:center;justify-content:center;gap:18px;
      margin-top:22px;
    }
    .pageBtn{
      width:38px;height:38px;border-radius:50%;border:none;
      background:var(--card);box-shadow:var(--shadow);color:var(--primary-dark);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .pageBtn svg{width:16px;height:16px;}
    .pageBtn:disabled{opacity:.35;}
    .pageBtn:not(:disabled):hover{background:var(--primary-light);}
    #pageIndicator{font-size:13.5px;color:var(--muted);min-width:56px;text-align:center;}

    .emptyState{
      text-align:center;padding:60px 20px;color:var(--muted);
      background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    }
    .emptyState svg{width:52px;height:52px;color:var(--primary-light);margin-bottom:10px;}

    /* ---------- Album detail ---------- */
    .detailHead{
      display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
    }
    .backBtn{
      background:var(--card);border:none;border-radius:10px;
      width:40px;height:40px;display:flex;align-items:center;justify-content:center;
      box-shadow:var(--shadow);flex-shrink:0;
    }
    .detailHead h2{
      font-size:18px;margin:0;flex:1;min-width:120px;
    }
    .hiddenFileInput{display:none;}

    #photoGrid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    }
    .photoThumb{
      position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;
      background:var(--primary-light);border:none;padding:0;
      user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
    }
    .photoThumb img{
      width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;
    }
    .photoThumb .selectMark{
      position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
      border:2px solid #fff;background:rgba(0,0,0,.28);
      display:none;align-items:center;justify-content:center;
    }
    #photoGrid.selecting .photoThumb .selectMark{display:flex;}
    .photoThumb .selectMark svg{width:13px;height:13px;opacity:0;transition:opacity .12s ease;}
    .photoThumb.selected .selectMark{background:var(--primary);border-color:var(--primary);}
    .photoThumb.selected .selectMark svg{opacity:1;}
    .photoThumb.selected::after{
      content:'';position:absolute;inset:0;background:rgba(47,111,78,.28);pointer-events:none;
    }

    /* ---------- แถบเลือกหลายรายการ ---------- */
    body.hasSelectionBar{padding-bottom:70px;}
    .selectionBar{
      position:fixed;left:0;right:0;bottom:0;z-index:900;
      background:#1c2b23;color:#fff;
      display:none;align-items:center;gap:12px;
      padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      box-shadow:0 -6px 24px rgba(0,0,0,.25);
    }
    .selectionBar .selCancelBtn{
      background:rgba(255,255,255,.12);border:none;color:#fff;
      width:36px;height:36px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
    }
    .selectionBar .selCount{font-size:13.5px;flex:1;white-space:nowrap;}
    .selectionBar .selActions{display:flex;gap:8px;}
    .selectionBar .selActionBtn{
      border:none;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;
      display:flex;align-items:center;gap:6px;color:#fff;white-space:nowrap;
    }
    .selectionBar .selActionBtn.download{background:var(--primary);}
    .selectionBar .selActionBtn.delete{background:var(--danger);}

    /* ---------- Lightbox ---------- */
    .lightbox{
      position:fixed;inset:0;background:rgba(10,20,15,.94);z-index:1000;
      display:flex;align-items:center;justify-content:center;
    }
    .lightbox .lbImgWrap{
      max-width:92vw;max-height:80vh;display:flex;align-items:center;justify-content:center;
      touch-action:pan-y;
    }
    .lightbox img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:6px;}
    .lbTopBar{
      position:absolute;top:0;left:0;right:0;
      display:flex;justify-content:space-between;align-items:center;
      padding:16px 18px;color:#fff;font-size:13px;
    }
    .lbCounter{opacity:.85;}
    .lbBtn{
      background:rgba(255,255,255,.12);border:none;color:#fff;
      width:42px;height:42px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
    }
    .lbNav{
      position:absolute;top:50%;transform:translateY(-50%);
      background:rgba(255,255,255,.14);border:none;color:#fff;
      width:46px;height:46px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
    }
    .lbPrev{left:14px;} .lbNext{right:14px;}
    @media (max-width:640px){ .lbNav{display:none;} }

    /* ---------- Modal ---------- */
    .modalOverlay{
      position:fixed;inset:0;background:rgba(10,20,15,.55);
      display:flex;align-items:center;justify-content:center;z-index:1100;padding:20px;
    }
    .modalBox{
      background:#fff;border-radius:var(--radius);padding:22px;width:100%;max-width:360px;
      box-shadow:var(--shadow-lg);
    }
    .modalBox h3{margin:0 0 4px;font-size:17px;}
    .modalBox p{margin:0 0 14px;font-size:13px;color:var(--muted);}
    .modalBox input[type=text]{
      width:100%;padding:11px 12px;border:1.5px solid #dfe6e1;border-radius:10px;
      font-family:inherit;font-size:15px;margin-bottom:16px;
    }
    .modalBox input[type=text]:focus{outline:none;border-color:var(--primary);}
    .modalActions{display:flex;gap:10px;justify-content:flex-end;}

    /* ---------- Loading overlay ---------- */
    #loadingOverlay{
      position:fixed;inset:0;background:rgba(242,244,240,.85);z-index:1300;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    }
    .spinner{
      width:34px;height:34px;border-radius:50%;
      border:3.5px solid var(--primary-light);border-top-color:var(--primary);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    #loadingOverlay span{font-size:13px;color:var(--muted);}

    .toast{
      position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
      background:#22302a;color:#fff;padding:11px 20px;border-radius:999px;
      font-size:13.5px;z-index:1400;box-shadow:var(--shadow-lg);
      opacity:0;transition:opacity .25s ease;pointer-events:none;
    }
    .toast.show{opacity:1;}
    .toast.error{background:var(--danger);}

    @media (max-width:560px){
      #albumGrid{gap:10px;}
      #photoGrid{grid-template-columns:repeat(3,1fr);gap:8px;}
      .albumCard .body{padding:10px 10px 10px;}
      .albumCard .name{font-size:12.5px;min-height:34px;}
      .albumCard .meta{font-size:10.5px;}
      .albumCard .cover .coverEmpty svg{width:26px;height:26px;}
      header h1{font-size:16px;}
      #userBadge{display:none;}
    }

    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
    }
  </style>
</head>
<body>

  <header>
    <div class="headerInner">
      <div class="brandMark">
        <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>ภาพกิจกรรม ส.ป.ก. น่าน</h1>
        <p>สำนักงานการปฏิรูปที่ดินจังหวัดน่าน</p>
      </div>
      <div id="userBadge"></div>
    </div>
  </header>

  <main>

    <!-- ============ หน้ารายการอัลบั้ม ============ -->
    <section id="albumListView">
      <div class="toolbar">
        <div class="searchBox">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#6b7b71" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="#6b7b71" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="ค้นหาอัลบั้ม...">
        </div>
        <button class="btn btn-primary" id="btnOpenCreateAlbum">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/></svg>
          สร้างอัลบั้ม
        </button>
      </div>

      <div id="albumGrid"></div>
      <div id="albumEmpty" class="emptyState" style="display:none">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.4"/></svg>
        <div id="albumEmptyText">ยังไม่มีอัลบั้ม กดปุ่ม "สร้างอัลบั้ม" เพื่อเริ่มต้น</div>
      </div>
      <div id="albumPagination" class="pagination" style="display:none">
        <button class="pageBtn" id="btnPrevPage" aria-label="หน้าก่อนหน้า">
          <svg viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span id="pageIndicator">1 / 1</span>
        <button class="pageBtn" id="btnNextPage" aria-label="หน้าถัดไป">
          <svg viewBox="0 0 24 24" fill="none"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <!-- ============ หน้ารายละเอียดอัลบั้ม ============ -->
    <section id="albumDetailView" style="display:none">
      <div class="detailHead">
        <button class="backBtn" id="btnBack" aria-label="กลับ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="#22302a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="albumTitle"></h2>
        <button class="backBtn" id="btnRenameAlbum" aria-label="แก้ไขชื่ออัลบั้ม">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="#22302a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-primary" id="btnUpload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          อัปโหลดรูป
        </button>
        <input type="file" id="fileInput" class="hiddenFileInput" accept="image/*" multiple>
      </div>

      <div id="photoGrid"></div>
      <div id="photoEmpty" class="emptyState" style="display:none">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 16.5 8.5 12a2 2 0 0 1 2.8 0L16 16.6M14 14l1.5-1.5a2 2 0 0 1 2.8 0L20 14.2M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.4"/></svg>
        <div>ยังไม่มีรูปในอัลบั้มนี้ กดปุ่ม "อัปโหลดรูป" เพื่อเพิ่มรูปแรก</div>
      </div>
    </section>

  </main>

  <!-- ============ Lightbox ============ -->
  <div id="lightbox" class="lightbox" style="display:none">
    <div class="lbTopBar">
      <span class="lbCounter" id="lbCounter"></span>
      <div style="display:flex;gap:8px;">
        <button class="lbBtn" id="lbDownload" aria-label="ดาวน์โหลดรูปนี้">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3v12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="m7 10 5 5 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="lbBtn" id="lbDelete" aria-label="ลบรูปนี้">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="lbBtn" id="lbClose" aria-label="ปิด">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <button class="lbNav lbPrev" id="lbPrev" aria-label="รูปก่อนหน้า">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="lbImgWrap" id="lbImgWrap">
      <img id="lbImg" src="" alt="">
    </div>
    <button class="lbNav lbNext" id="lbNext" aria-label="รูปถัดไป">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m9 5 7 7-7 7" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- ============ แถบเลือกหลายรายการ (กดค้างที่รูปเพื่อเริ่มเลือก) ============ -->
  <div id="selectionBar" class="selectionBar">
    <button class="selCancelBtn" id="btnCancelSelect" aria-label="ยกเลิกการเลือก">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <span class="selCount" id="selectionCount">0 รายการ</span>
    <div class="selActions">
      <button class="selActionBtn download" id="btnDownloadSelected">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="m7 10 5 5 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        ดาวน์โหลด
      </button>
      <button class="selActionBtn delete" id="btnDeleteSelected">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ลบ
      </button>
    </div>
  </div>
  <div id="modalCreateAlbum" class="modalOverlay" style="display:none">
    <div class="modalBox">
      <h3 id="albumModalTitle">สร้างอัลบั้มใหม่</h3>
      <p id="albumModalDesc">ตั้งชื่ออัลบั้ม เช่น ชื่อกิจกรรมและวันที่</p>
      <input type="text" id="newAlbumName" placeholder="เช่น อบรมเกษตรกร 24 ส.ค. 69" maxlength="100">
      <div class="modalActions">
        <button class="btn btn-ghost" id="btnCancelCreate">ยกเลิก</button>
        <button class="btn btn-primary" id="btnConfirmCreate">สร้างอัลบั้ม</button>
      </div>
    </div>
  </div>

  <!-- ============ Loading ============ -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <span id="loadingText">กำลังโหลด...</span>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    /* ============================================================
       ⚙️ ตั้งค่า: ใส่ URL เว็บแอป Google Apps Script ของคุณตรงนี้
       (เข้า Apps Script > Deploy > Manage deployments > คัดลอก URL ที่ลงท้ายด้วย /exec)
       ============================================================ */
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzsStDtJVMdVOI6L6-zKot9vOId4IxStp8_RwV1uOYbTsTFtFWc-mns2LCxNT64X3YV/exec';

    /* ============================================================
       ตัวช่วยเรียกฟังก์ชันฝั่งเซิร์ฟเวอร์แบบ Promise (async/await ได้)
       หน้านี้ถูกโฮสต์แยกอยู่บน GitHub Pages จึงเรียก google.script.run
       ตรง ๆ ไม่ได้ ต้องยิง fetch() แบบ JSON ไปหา Apps Script Web App แทน
       (ส่ง Content-Type เป็น text/plain เพื่อเลี่ยงปัญหา CORS preflight)
       ============================================================ */
    function callServer(fnName) {
      var args = Array.prototype.slice.call(arguments, 1);

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('วาง URL') !== -1) {
        return Promise.reject(new Error('ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL ในไฟล์ index.html'));
      }

      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: fnName, args: args })
      })
        .then(function (res) {
          if (!res.ok) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ (HTTP ' + res.status + ')');
          return res.json();
        })
        .then(function (json) {
          if (!json || !json.ok) throw new Error((json && json.error) || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ');
          return json.data;
        });
    }

    var loadingOverlay = document.getElementById('loadingOverlay');
    var loadingText = document.getElementById('loadingText');
    function showLoading(text) {
      loadingText.textContent = text || 'กำลังโหลด...';
      loadingOverlay.style.display = 'flex';
    }
    function hideLoading() { loadingOverlay.style.display = 'none'; }

    var toastEl = document.getElementById('toast');
    var toastTimer = null;
    function showToast(msg, isError) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 2600);
    }

    function escapeHtml(str) {
      var d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function formatDate(ts) {
      try {
        return new Date(ts).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (e) { return ''; }
    }

    /* ============================ สถานะแอป ============================ */
    var allAlbums = [];
    var currentAlbumId = null;
    var currentAlbumName = '';
    var currentPhotos = [];
    var lightboxIndex = 0;
    var selectionMode = false;
    var selectedIds = new Set();

    /* ============================ เริ่มต้น ============================ */
    window.addEventListener('DOMContentLoaded', init);

    function init() {
      history.replaceState({ view: 'list' }, '', location.href);
      callServer('getCurrentUserEmail').then(function (email) {
        if (email) document.getElementById('userBadge').textContent = email;
      }).catch(function () {});
      loadAlbums();
    }

    // ทำให้ปุ่มย้อนกลับของเบราว์เซอร์/มือถือ ใช้งานได้เหมือนปุ่ม < ในแอป
    function applyState(state) {
      state = state || { view: 'list' };
      exitSelectionMode();

      if (state.view === 'lightbox') {
        document.getElementById('albumListView').style.display = 'none';
        document.getElementById('albumDetailView').style.display = 'block';
        lightboxIndex = Math.min(state.index || 0, Math.max(currentPhotos.length - 1, 0));
        renderLightbox();
        lightbox.style.display = 'flex';
        document.addEventListener('keydown', onLightboxKeydown);
      } else if (state.view === 'detail') {
        lightbox.style.display = 'none';
        document.removeEventListener('keydown', onLightboxKeydown);
        document.getElementById('albumListView').style.display = 'none';
        document.getElementById('albumDetailView').style.display = 'block';
      } else {
        lightbox.style.display = 'none';
        document.removeEventListener('keydown', onLightboxKeydown);
        document.getElementById('albumDetailView').style.display = 'none';
        document.getElementById('albumListView').style.display = 'block';
        loadAlbums(true);
      }
    }
    window.addEventListener('popstate', function (e) { applyState(e.state); });

    /* ============================ อัลบั้ม ============================ */
    var filteredAlbums = [];
    var currentAlbumPage = 1;
    var ALBUMS_PER_PAGE = 20; // 10 แถว x 2 อัลบั้ม/แถว

    // keepPage = true เพื่อไม่ให้กระโดดกลับไปหน้า 1 ทุกครั้งที่โหลดใหม่ (เช่นตอนกด "ย้อนกลับ")
    function loadAlbums(keepPage) {
      showLoading('กำลังโหลดอัลบั้ม...');
      callServer('listAlbums').then(function (albums) {
        allAlbums = albums;
        applyAlbumFilter(!keepPage);
        hideLoading();
      }).catch(function (err) {
        hideLoading();
        showToast('โหลดอัลบั้มไม่สำเร็จ: ' + (err && err.message ? err.message : err), true);
      });
    }

    function applyAlbumFilter(resetPage) {
      var q = document.getElementById('searchInput').value.trim().toLowerCase();
      filteredAlbums = !q ? allAlbums : allAlbums.filter(function (a) {
        return a.name.toLowerCase().indexOf(q) !== -1;
      });

      var emptyText = document.getElementById('albumEmptyText');
      if (q && filteredAlbums.length === 0) {
        emptyText.textContent = 'ไม่พบอัลบั้มที่ตรงกับ "' + q + '"';
      } else {
        emptyText.textContent = 'ยังไม่มีอัลบั้ม กดปุ่ม "สร้างอัลบั้ม" เพื่อเริ่มต้น';
      }

      if (resetPage) currentAlbumPage = 1;
      var totalPages = Math.max(1, Math.ceil(filteredAlbums.length / ALBUMS_PER_PAGE));
      if (currentAlbumPage > totalPages) currentAlbumPage = totalPages;

      renderAlbums();
    }

    function renderAlbums() {
      var grid = document.getElementById('albumGrid');
      var empty = document.getElementById('albumEmpty');
      var pagination = document.getElementById('albumPagination');
      grid.innerHTML = '';

      if (!filteredAlbums.length) {
        empty.style.display = 'block';
        grid.style.display = 'none';
        pagination.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      grid.style.display = 'grid';

      var totalPages = Math.max(1, Math.ceil(filteredAlbums.length / ALBUMS_PER_PAGE));
      var startIdx = (currentAlbumPage - 1) * ALBUMS_PER_PAGE;
      var pageAlbums = filteredAlbums.slice(startIdx, startIdx + ALBUMS_PER_PAGE);

      pageAlbums.forEach(function (album) {
        var card = document.createElement('div');
        card.className = 'albumCard';

        var photos = album.photos || [];
        var coverHtml;
        if (photos.length) {
          coverHtml = photos.map(function (url) {
            return '<img src="' + url + '" alt="" loading="lazy" draggable="false">';
          }).join('');
          for (var i = photos.length; i < 4; i++) {
            coverHtml += '<div class="coverBlank"></div>';
          }
        } else {
          coverHtml = '<div class="coverEmpty"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div>';
        }

        card.innerHTML =
          '<div class="tab"></div>' +
          '<button class="albumCardBtn" data-id="' + album.id + '">' +
            '<div class="cover">' + coverHtml + '</div>' +
            '<div class="body">' +
              '<div class="name">' + escapeHtml(album.name) + '</div>' +
              '<div class="meta">' + album.count + ' รูป · ' + formatDate(album.createdDate) + '</div>' +
            '</div>' +
          '</button>' +
          '<div class="cardActions">' +
            '<button class="iconBtn edit" data-id="' + album.id + '" data-name="' + escapeHtml(album.name) + '" data-action="edit" aria-label="แก้ไขชื่ออัลบั้ม">' +
              '<svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '</button>' +
            '<button class="iconBtn danger" data-id="' + album.id + '" data-name="' + escapeHtml(album.name) + '" data-action="delete" aria-label="ลบอัลบั้ม">' +
              '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '</button>' +
          '</div>';
        grid.appendChild(card);
      });

      grid.querySelectorAll('.albumCardBtn').forEach(function (btn) {
        btn.addEventListener('click', function () { openAlbum(btn.dataset.id); });
      });
      grid.querySelectorAll('.iconBtn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var id = btn.dataset.id, name = btn.dataset.name;
          if (btn.dataset.action === 'edit') {
            openAlbumModal('rename', id, name);
          } else {
            confirmDeleteAlbum(id, name);
          }
        });
      });

      renderAlbumPagination(totalPages);
    }

    function renderAlbumPagination(totalPages) {
      var pagination = document.getElementById('albumPagination');
      if (totalPages <= 1) {
        pagination.style.display = 'none';
        return;
      }
      pagination.style.display = 'flex';
      document.getElementById('pageIndicator').textContent = currentAlbumPage + ' / ' + totalPages;
      document.getElementById('btnPrevPage').disabled = currentAlbumPage <= 1;
      document.getElementById('btnNextPage').disabled = currentAlbumPage >= totalPages;
    }

    document.getElementById('btnPrevPage').addEventListener('click', function () {
      if (currentAlbumPage > 1) {
        currentAlbumPage--;
        renderAlbums();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
    document.getElementById('btnNextPage').addEventListener('click', function () {
      var totalPages = Math.max(1, Math.ceil(filteredAlbums.length / ALBUMS_PER_PAGE));
      if (currentAlbumPage < totalPages) {
        currentAlbumPage++;
        renderAlbums();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    document.getElementById('searchInput').addEventListener('input', function () {
      applyAlbumFilter(true);
    });

    /* ---------- สร้าง / แก้ไขชื่ออัลบั้ม (ใช้โมดัลร่วมกัน) ---------- */
    var modalCreate = document.getElementById('modalCreateAlbum');
    var newAlbumInput = document.getElementById('newAlbumName');
    var albumModalTitleEl = document.getElementById('albumModalTitle');
    var albumModalDescEl = document.getElementById('albumModalDesc');
    var btnConfirmAlbumEl = document.getElementById('btnConfirmCreate');

    var albumModalMode = 'create'; // 'create' หรือ 'rename'
    var renamingAlbumId = null;

    function openAlbumModal(mode, albumId, currentName) {
      albumModalMode = mode;
      renamingAlbumId = albumId || null;
      newAlbumInput.value = mode === 'rename' ? (currentName || '') : '';
      albumModalTitleEl.textContent = mode === 'rename' ? 'แก้ไขชื่ออัลบั้ม' : 'สร้างอัลบั้มใหม่';
      albumModalDescEl.textContent = mode === 'rename' ? 'ตั้งชื่อใหม่ให้อัลบั้มนี้' : 'ตั้งชื่ออัลบั้ม เช่น ชื่อกิจกรรมและวันที่';
      btnConfirmAlbumEl.textContent = mode === 'rename' ? 'บันทึก' : 'สร้างอัลบั้ม';
      modalCreate.style.display = 'flex';
      setTimeout(function () { newAlbumInput.focus(); newAlbumInput.select(); }, 50);
    }

    document.getElementById('btnOpenCreateAlbum').addEventListener('click', function () {
      openAlbumModal('create');
    });
    document.getElementById('btnRenameAlbum').addEventListener('click', function () {
      openAlbumModal('rename', currentAlbumId, currentAlbumName);
    });
    document.getElementById('btnCancelCreate').addEventListener('click', function () {
      modalCreate.style.display = 'none';
    });
    modalCreate.addEventListener('click', function (e) {
      if (e.target === modalCreate) modalCreate.style.display = 'none';
    });
    newAlbumInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') btnConfirmAlbumEl.click();
    });

    btnConfirmAlbumEl.addEventListener('click', function () {
      var name = newAlbumInput.value.trim();
      if (!name) { showToast('กรุณาตั้งชื่ออัลบั้ม', true); return; }
      modalCreate.style.display = 'none';

      if (albumModalMode === 'rename') {
        showLoading('กำลังบันทึกชื่ออัลบั้ม...');
        callServer('renameAlbum', renamingAlbumId, name).then(function () {
          hideLoading();
          showToast('แก้ไขชื่ออัลบั้มแล้ว');
          if (currentAlbumId === renamingAlbumId) {
            currentAlbumName = name;
            document.getElementById('albumTitle').textContent = name;
          }
          loadAlbums(true);
        }).catch(function (err) {
          hideLoading();
          showToast(err && err.message ? err.message : 'แก้ไขชื่ออัลบั้มไม่สำเร็จ', true);
        });
      } else {
        showLoading('กำลังสร้างอัลบั้ม...');
        callServer('createAlbum', name).then(function () {
          hideLoading();
          showToast('สร้างอัลบั้มเรียบร้อย');
          loadAlbums();
        }).catch(function (err) {
          hideLoading();
          showToast(err && err.message ? err.message : 'สร้างอัลบั้มไม่สำเร็จ', true);
        });
      }
    });

    /* ---------- ลบอัลบั้ม ---------- */
    function confirmDeleteAlbum(albumId, albumName) {
      if (!confirm('ลบอัลบั้ม "' + albumName + '" ใช่หรือไม่?\nรูปทั้งหมดในอัลบั้มจะถูกย้ายไปถังขยะของ Google Drive (กู้คืนได้ภายใน 30 วัน)')) return;
      showLoading('กำลังลบอัลบั้ม...');
      callServer('deleteAlbum', albumId).then(function () {
        hideLoading();
        showToast('ลบอัลบั้มแล้ว');
        loadAlbums(true);
      }).catch(function (err) {
        hideLoading();
        showToast(err && err.message ? err.message : 'ลบอัลบั้มไม่สำเร็จ', true);
      });
    }

    /* ============================ รายละเอียดอัลบั้ม ============================ */
    function openAlbum(albumId) {
      var album = allAlbums.find(function (a) { return a.id === albumId; });
      currentAlbumId = albumId;
      currentAlbumName = album ? album.name : '';
      document.getElementById('albumTitle').textContent = currentAlbumName;
      document.getElementById('albumListView').style.display = 'none';
      document.getElementById('albumDetailView').style.display = 'block';
      history.pushState({ view: 'detail', albumId: albumId }, '', location.href);
      loadPhotos();
    }

    document.getElementById('btnBack').addEventListener('click', function () {
      history.back();
    });

    function loadPhotos() {
      showLoading('กำลังโหลดรูปภาพ...');
      callServer('listPhotos', currentAlbumId).then(function (photos) {
        currentPhotos = photos;
        renderPhotos();
        hideLoading();
      }).catch(function (err) {
        hideLoading();
        showToast('โหลดรูปไม่สำเร็จ: ' + (err && err.message ? err.message : err), true);
      });
    }

    function renderPhotos() {
      exitSelectionMode();
      var grid = document.getElementById('photoGrid');
      var empty = document.getElementById('photoEmpty');
      grid.innerHTML = '';

      if (!currentPhotos.length) {
        empty.style.display = 'block';
        grid.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      grid.style.display = 'grid';

      currentPhotos.forEach(function (photo, index) {
        var thumb = document.createElement('div');
        thumb.className = 'photoThumb';
        thumb.dataset.id = photo.id;
        var imgSrc = photo.thumbnailUrl || '';
        thumb.innerHTML =
          '<img src="' + imgSrc + '" alt="' + escapeHtml(photo.name) + '" loading="lazy" draggable="false">' +
          '<div class="selectMark"><svg viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';

        var imgEl = thumb.querySelector('img');
        imgEl.addEventListener('error', function () {
          callServer('getPhotoFull', photo.id).then(function (dataUrl) {
            imgEl.src = dataUrl;
          }).catch(function () {});
        });

        // กดค้างเพื่อเริ่มโหมดเลือกหลายรายการ, กดปกติเพื่อเปิดดูรูป (หรือสลับการเลือกถ้าอยู่ในโหมดเลือก)
        var pressTimer = null;
        var longPressFired = false;
        var startX = 0, startY = 0;

        thumb.addEventListener('pointerdown', function (e) {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          longPressFired = false;
          startX = e.clientX; startY = e.clientY;
          pressTimer = setTimeout(function () {
            longPressFired = true;
            pressTimer = null;
            if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e2) {} }
            if (!selectionMode) enterSelectionMode();
            toggleSelect(photo.id, thumb);
          }, 450);
        });
        thumb.addEventListener('pointermove', function (e) {
          if (pressTimer && (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10)) {
            clearTimeout(pressTimer); pressTimer = null;
          }
        });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evt) {
          thumb.addEventListener(evt, function () {
            if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
          });
        });
        thumb.addEventListener('click', function () {
          if (longPressFired) { longPressFired = false; return; }
          if (selectionMode) {
            toggleSelect(photo.id, thumb);
          } else {
            openLightbox(index);
          }
        });

        grid.appendChild(thumb);
      });
    }

    /* ---------- โหมดเลือกหลายรายการ ---------- */
    function enterSelectionMode() {
      selectionMode = true;
      document.getElementById('photoGrid').classList.add('selecting');
      document.getElementById('selectionBar').style.display = 'flex';
      document.body.classList.add('hasSelectionBar');
    }

    function exitSelectionMode() {
      selectionMode = false;
      selectedIds.clear();
      var grid = document.getElementById('photoGrid');
      grid.classList.remove('selecting');
      grid.querySelectorAll('.photoThumb.selected').forEach(function (el) { el.classList.remove('selected'); });
      document.getElementById('selectionBar').style.display = 'none';
      document.body.classList.remove('hasSelectionBar');
    }

    function toggleSelect(id, el) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      if (el) el.classList.toggle('selected', selectedIds.has(id));
      if (selectedIds.size === 0) {
        exitSelectionMode();
      } else {
        document.getElementById('selectionCount').textContent = selectedIds.size + ' รายการ';
      }
    }

    document.getElementById('btnCancelSelect').addEventListener('click', exitSelectionMode);

    document.getElementById('btnDeleteSelected').addEventListener('click', function () {
      deleteSelectedPhotos();
    });
    document.getElementById('btnDownloadSelected').addEventListener('click', function () {
      downloadSelectedPhotos();
    });

    async function deleteSelectedPhotos() {
      var ids = Array.from(selectedIds);
      if (!ids.length) return;
      if (!confirm('ลบรูปที่เลือกไว้ ' + ids.length + ' รูป ใช่หรือไม่?\nกู้คืนได้จากถังขยะ Google Drive ภายใน 30 วัน')) return;
      var failed = 0;
      for (var i = 0; i < ids.length; i++) {
        showLoading('กำลังลบรูป (' + (i + 1) + '/' + ids.length + ')...');
        try { await callServer('deletePhoto', ids[i]); } catch (e) { failed++; }
      }
      hideLoading();
      showToast(failed ? ('ลบไม่สำเร็จ ' + failed + ' รูป') : 'ลบรูปที่เลือกแล้ว', failed > 0);
      loadPhotos();
    }

    async function downloadSelectedPhotos() {
      var ids = Array.from(selectedIds);
      if (!ids.length) return;

      if (ids.length === 1) {
        var onlyPhoto = currentPhotos.find(function (p) { return p.id === ids[0]; });
        exitSelectionMode();
        await downloadSinglePhoto(ids[0], onlyPhoto ? onlyPhoto.name : 'photo.jpg');
        return;
      }

      showLoading('กำลังเตรียมไฟล์ (0/' + ids.length + ')...');
      try {
        var zip = new JSZip();
        for (var i = 0; i < ids.length; i++) {
          loadingText.textContent = 'กำลังเตรียมไฟล์ (' + (i + 1) + '/' + ids.length + ')...';
          var photo = currentPhotos.find(function (p) { return p.id === ids[i]; });
          var dataUrl = await callServer('getPhotoFull', ids[i]);
          var base64 = dataUrl.split(',')[1];
          var safeName = (i + 1) + '_' + (photo ? photo.name : ('photo' + (i + 1) + '.jpg'));
          zip.file(safeName, base64, { base64: true });
        }
        var content = await zip.generateAsync({ type: 'blob' });
        var blobUrl = URL.createObjectURL(content);
        var a = document.createElement('a');
        a.href = blobUrl;
        a.download = (currentAlbumName || 'album') + '.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 4000);
        hideLoading();
        showToast('ดาวน์โหลดไฟล์ zip เรียบร้อย');
      } catch (err) {
        hideLoading();
        showToast('ดาวน์โหลดไม่สำเร็จ', true);
      }
      exitSelectionMode();
    }

    async function downloadSinglePhoto(fileId, filename) {
      showLoading('กำลังเตรียมไฟล์ดาวน์โหลด...');
      try {
        var dataUrl = await callServer('getPhotoFull', fileId);
        var res = await fetch(dataUrl);
        var blob = await res.blob();
        var blobUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename || 'photo.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 4000);
        hideLoading();
      } catch (err) {
        hideLoading();
        showToast('ดาวน์โหลดไม่สำเร็จ', true);
      }
    }

    /* ---------- อัปโหลดรูป ---------- */
    var fileInput = document.getElementById('fileInput');
    document.getElementById('btnUpload').addEventListener('click', function () {
      fileInput.value = '';
      fileInput.click();
    });

    fileInput.addEventListener('change', function () {
      var files = Array.prototype.slice.call(fileInput.files || []);
      if (!files.length) return;
      uploadFilesSequentially(files);
    });

    function readFileAsBase64(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () { resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadFilesSequentially(files) {
      var total = files.length;
      for (var i = 0; i < total; i++) {
        var file = files[i];
        showLoading('กำลังอัปโหลด ' + (i + 1) + ' / ' + total + '...');
        try {
          var base64 = await readFileAsBase64(file);
          await callServer('uploadPhoto', currentAlbumId, base64, file.name, file.type);
        } catch (err) {
          showToast('อัปโหลด "' + file.name + '" ไม่สำเร็จ', true);
        }
      }
      hideLoading();
      showToast('อัปโหลดรูปเรียบร้อย ' + total + ' รูป');
      loadPhotos();
    }

    /* ---------- ลบรูป (ลบทีละรูปทำได้จากในหน้าดูรูปเต็ม หรือเลือกหลายรูปแล้วลบพร้อมกัน) ---------- */

    /* ============================ Lightbox (ดูรูปเต็ม + ปัดซ้ายขวา) ============================ */
    var lightbox = document.getElementById('lightbox');
    var lbImg = document.getElementById('lbImg');
    var lbCounter = document.getElementById('lbCounter');

    function bigUrl(url) {
      if (!url) return url;
      return url.replace(/=s\d+(-c)?$/, '=s1600').replace(/=w\d+(-h\d+)?(-c)?$/, '=w1600');
    }

    function openLightbox(index) {
      lightboxIndex = index;
      renderLightbox();
      lightbox.style.display = 'flex';
      document.addEventListener('keydown', onLightboxKeydown);
      history.pushState({ view: 'lightbox', albumId: currentAlbumId, index: index }, '', location.href);
    }

    function closeLightbox() {
      history.back();
    }

    function renderLightbox() {
      var photo = currentPhotos[lightboxIndex];
      if (!photo) return;
      lbImg.src = bigUrl(photo.thumbnailUrl) || '';
      lbImg.alt = photo.name;
      lbCounter.textContent = (lightboxIndex + 1) + ' / ' + currentPhotos.length;
      lbImg.onerror = function () {
        callServer('getPhotoFull', photo.id).then(function (dataUrl) {
          lbImg.src = dataUrl;
        }).catch(function () {});
      };
    }

    function lbNext() { lightboxIndex = (lightboxIndex + 1) % currentPhotos.length; renderLightbox(); }
    function lbPrev() { lightboxIndex = (lightboxIndex - 1 + currentPhotos.length) % currentPhotos.length; renderLightbox(); }

    document.getElementById('lbNext').addEventListener('click', lbNext);
    document.getElementById('lbPrev').addEventListener('click', lbPrev);
    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbDownload').addEventListener('click', function () {
      var photo = currentPhotos[lightboxIndex];
      if (!photo) return;
      downloadSinglePhoto(photo.id, photo.name);
    });
    document.getElementById('lbDelete').addEventListener('click', function () {
      var photo = currentPhotos[lightboxIndex];
      if (!photo) return;
      if (!confirm('ลบรูปนี้ใช่หรือไม่? (กู้คืนได้จากถังขยะ Google Drive ภายใน 30 วัน)')) return;
      showLoading('กำลังลบรูป...');
      callServer('deletePhoto', photo.id).then(function () {
        hideLoading();
        showToast('ลบรูปแล้ว');
        currentPhotos.splice(lightboxIndex, 1);
        if (!currentPhotos.length) { renderPhotos(); closeLightbox(); return; }
        lightboxIndex = lightboxIndex % currentPhotos.length;
        renderLightbox();
        renderPhotos();
      }).catch(function (err) {
        hideLoading();
        showToast(err && err.message ? err.message : 'ลบรูปไม่สำเร็จ', true);
      });
    });

    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closeLightbox();
    });

    function onLightboxKeydown(e) {
      if (e.key === 'ArrowRight') lbNext();
      else if (e.key === 'ArrowLeft') lbPrev();
      else if (e.key === 'Escape') closeLightbox();
    }

    // ปัดซ้าย-ขวาบนมือถือ
    var touchStartX = null;
    var lbImgWrap = document.getElementById('lbImgWrap');
    lbImgWrap.addEventListener('touchstart', function (e) {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });
    lbImgWrap.addEventListener('touchend', function (e) {
      if (touchStartX === null) return;
      var deltaX = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(deltaX) > 50) {
        if (deltaX < 0) lbNext(); else lbPrev();
      }
      touchStartX = null;
    }, { passive: true });
  </script>
</body>
</html>
